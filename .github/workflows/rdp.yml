name: Windows VNC

on:
  workflow_dispatch:

jobs:
  tightvnc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          # 创建用户
          net user vncuser "Newera@2625" /add
          net localgroup "Administrators" vncuser /add

          # 安装 TightVNC 64位
          $msi = "$env:TEMP\tightvnc.msi"
          $dl = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          for ($i = 1; $i -le 3; $i++) {
            curl.exe -L --retry 2 --retry-delay 5 -o $msi $dl
            if ((Test-Path $msi) -and ((Get-Item $msi).Length -gt 1MB)) { break }
            Start-Sleep -Seconds 5
          }
          $args = "/i `"$msi`" /qn /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=Newera@2625 SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=Newera@2625"
          Start-Process msiexec.exe -ArgumentList $args -Wait

          # 允许 loopback
          $key = "HKLM:\Software\TightVNC\Server"
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name "AllowLoopback" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "LoopbackOnly" -Value 0 -Type DWord
          Get-Service | Where-Object { $_.Name -like "*tvn*" } | Restart-Service -Force -ErrorAction SilentlyContinue

          # Python + websockify
          choco install python -y --no-progress
          python -m pip install websockify

          # noVNC
          $workDir = (Get-Location).Path
          $novncDir = "$workDir\novnc"
          New-Item -ItemType Directory -Path $novncDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile "$workDir\novnc.zip"
          Expand-Archive -Path "$workDir\novnc.zip" -DestinationPath $workDir -Force
          Copy-Item -Path "$workDir\noVNC-master\*" -Destination $novncDir -Recurse -Force

          # websockify 隐藏启动
          $pythonPath = (Get-Command python).Source
          Start-Process -FilePath $pythonPath -ArgumentList "-m websockify 6080 localhost:5900 --web $novncDir" -WorkingDirectory $workDir -WindowStyle Hidden
          Start-Sleep -Seconds 8

          # cloudflared
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

          # 后台隐藏脚本
          $hidden = @"
`$workDir = '$workDir'
`$outLog = "`$workDir\cf-out.log"
`$errLog = "`$workDir\cf-err.log"
`$urlFile = "`$workDir\url.txt"
Start-Process -FilePath "`$workDir\cloudflared.exe" -ArgumentList 'tunnel --url http://localhost:6080 --no-autoupdate' -RedirectStandardOutput `$outLog -RedirectStandardError `$errLog -WindowStyle Hidden
`$url = ''
for (`$i = 0; `$i -lt 60; `$i++) {
  Start-Sleep -Seconds 5
  foreach (`$lf in @(`$outLog, `$errLog)) {
    if ((Test-Path `$lf) -and ((Get-Item `$lf).Length -gt 0)) {
      `$t = Get-Content `$lf -Raw -ErrorAction SilentlyContinue
      if (`$t) {
        `$m = [regex]::Match(`$t, 'https://[a-z0-9-]+\.trycloudflare\.com')
        if (`$m.Success) { `$url = `$m.Value; break }
      }
    }
  }
  if (`$url) { break }
}
`$url | Out-File `$urlFile -Encoding ascii
`$deadline = (Get-Date).AddHours(5)
while ((Get-Date) -lt `$deadline) { Start-Sleep -Seconds 60 }
"@
          $tmp = "$env:TEMP\tunnel-bg.ps1"
          Set-Content -Path $tmp -Value $hidden -Encoding UTF8
          Start-Process powershell -ArgumentList "-ExecutionPolicy Bypass -WindowStyle Hidden -File `"$tmp`"" -WindowStyle Hidden

          # 读回 URL 并输出
          $url = ""
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            if (Test-Path "$workDir\url.txt") {
              $u = (Get-Content "$workDir\url.txt" -Raw).Trim()
              if ($u) { $url = $u; break }
            }
          }

          Write-Output ""
          Write-Output "======================================================"
          Write-Output "              WINDOWS VNC READY"
          Write-Output "======================================================"
          Write-Output "  URL      : $url/vnc.html"
          Write-Output "  Password : Newera@2625"
          Write-Output "======================================================"
          Write-Output ""

          # 隐藏当前窗口
          Add-Type -Name Window -Namespace Console -MemberDefinition @'
[DllImport("Kernel32.dll")]
public static extern IntPtr GetConsoleWindow();
[DllImport("user32.dll")]
public static extern bool ShowWindow(IntPtr hWnd, Int32 nCmdShow);
'@
          $console = [Console.Window]::GetConsoleWindow()
          [Console.Window]::ShowWindow($console, 0) | Out-Null

          # 空等 5 小时
          $deadline = (Get-Date).AddHours(5)
          while ((Get-Date) -lt $deadline) { Start-Sleep -Seconds 60 }
