name: Windows VNC

on:
  workflow_dispatch:

jobs:
  tightvnc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Create User
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "########## STEP 1: CREATE USER ##########"
          Write-Output "[cmd] net user vncuser Newera@2625 /add"
          net user vncuser "Newera@2625" /add
          Write-Output "[exit=$LASTEXITCODE]"
          Write-Output "[cmd] net localgroup Administrators vncuser /add"
          net localgroup "Administrators" vncuser /add
          Write-Output "[exit=$LASTEXITCODE]"
          net user vncuser
          Write-Output "########## STEP 1 DONE ##########"

      - name: 2. Install TightVNC (64-bit)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "########## STEP 2: INSTALL TIGHTVNC ##########"
          $msi = "$env:TEMP\tightvnc.msi"
          $dl = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          Write-Output "[info] url = $dl"
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Output "----- attempt $i -----"
            curl.exe -L --retry 2 --retry-delay 5 -o $msi $dl
            Write-Output "[exit=$LASTEXITCODE]"
            if ((Test-Path $msi) -and ((Get-Item $msi).Length -gt 1MB)) {
              $ok = $true
              Write-Output "[ok] size = $((Get-Item $msi).Length) bytes"
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "tightvnc download failed" }

          Write-Output "[cmd] msiexec silent install with password"
          $args = "/i `"$msi`" /qn /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=Newera@2625 SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=Newera@2625"
          $t0 = Get-Date
          Start-Process msiexec.exe -ArgumentList $args -Wait
          $dt = (Get-Date) - $t0
          Write-Output "[ok] install took $($dt.TotalSeconds)s"

          Write-Output "----- install dir -----"
          foreach ($p in @("C:\Program Files\TightVNC", "C:\Program Files (x86)\TightVNC")) {
            if (Test-Path $p) {
              Write-Output "[found] $p"
              Get-ChildItem $p | Select-Object Name | ForEach-Object { Write-Output "    $($_.Name)" }
            } else {
              Write-Output "[not found] $p"
            }
          }

          Write-Output "----- service -----"
          Get-Service | Where-Object { $_.Name -like "*tvn*" -or $_.Name -like "*vnc*" } | Select-Object Name, Status, StartType | Format-Table | Out-String | Write-Output

          Write-Output "----- netstat 5900 -----"
          netstat -ano | findstr "5900"
          Write-Output "########## STEP 2 DONE ##########"

      - name: 3. Install Python & websockify + noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "########## STEP 3: PYTHON + NOVNC ##########"
          choco install python -y --no-progress
          Write-Output "[exit=$LASTEXITCODE]"
          python -m pip install websockify
          Write-Output "[exit=$LASTEXITCODE]"

          $workDir = (Get-Location).Path
          $novncDir = "$workDir\novnc"
          New-Item -ItemType Directory -Path $novncDir -Force | Out-Null
          $zip = "$workDir\novnc.zip"
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $workDir -Force
          Copy-Item -Path "$workDir\noVNC-master\*" -Destination $novncDir -Recurse -Force
          Write-Output "[ok] noVNC ready"
          Write-Output "########## STEP 3 DONE ##########"

      - name: 4. Start websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "########## STEP 4: WEBSOCKIFY ##########"
          $pythonPath = (Get-Command python).Source
          $workDir = (Get-Location).Path
          $novncDir = "$workDir\novnc"
          Start-Process -FilePath $pythonPath -ArgumentList "-m websockify 6080 localhost:5900 --web $novncDir" -WorkingDirectory $workDir -WindowStyle Hidden
          Start-Sleep -Seconds 8
          Write-Output "----- netstat 6080 -----"
          netstat -ano | findstr "6080"
          Write-Output "########## STEP 4 DONE ##########"

      - name: 5. Start Cloudflare Tunnel & Show Info
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "########## STEP 5: TUNNEL ##########"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          $workDir = (Get-Location).Path
          $outLog = "$workDir\cf-out.log"
          $errLog = "$workDir\cf-err.log"
          Start-Process -FilePath "$workDir\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:6080 --no-autoupdate" -RedirectStandardOutput $outLog -RedirectStandardError $errLog -NoNewWindow
          $url = ""
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            foreach ($lf in @($outLog, $errLog)) {
              if ((Test-Path $lf) -and ((Get-Item $lf).Length -gt 0)) {
                $logText = Get-Content $lf -Raw -ErrorAction SilentlyContinue
                if ($logText) {
                  $m = [regex]::Match($logText, 'https://[a-z0-9-]+\.trycloudflare\.com')
                  if ($m.Success) { $url = $m.Value; break }
                }
              }
            }
            if ($url) { break }
          }

          Write-Output ""
          Write-Output "======================================================"
          Write-Output "              WINDOWS VNC READY"
          Write-Output "======================================================"
          Write-Output "  URL      : $url/vnc.html"
          Write-Output "  Password : Newera@2625"
          Write-Output "======================================================"
          Write-Output ""

          Write-Output "########## DIAG START ##########"
          Write-Output "--- 5900 ---"
          netstat -ano | findstr "5900"
          Write-Output "--- 6080 ---"
          netstat -ano | findstr "6080"
          Write-Output "--- vnc service ---"
          Get-Service | Where-Object { $_.Name -like "*tvn*" -or $_.Name -like "*vnc*" } | Select-Object Name, Status | Format-Table | Out-String | Write-Output
          Write-Output "--- vnc proc ---"
          Get-Process | Where-Object { $_.Name -like "*vnc*" -or $_.Name -like "*tvn*" } | Select-Object Name, Id | Format-Table | Out-String | Write-Output
          Write-Output "########## DIAG END ##########"

          Write-Output "########## KEEP ALIVE START (5h) ##########"
          $loopDeadline = (Get-Date).AddHours(5)
          $tick = 0
          while ((Get-Date) -lt $loopDeadline) {
            $tick++
            Write-Output ""
            Write-Output "----- tick #$tick  $(Get-Date -Format 'HH:mm:ss') -----"
            Write-Output "[5900]"
            (netstat -ano | findstr "5900") | ForEach-Object { Write-Output "  $_" }
            Write-Output "[6080]"
            (netstat -ano | findstr "6080") | ForEach-Object { Write-Output "  $_" }
            Write-Output "[vnc proc]"
            (Get-Process | Where-Object { $_.Name -like "*vnc*" -or $_.Name -like "*tvn*" } | Select-Object Name, Id) | ForEach-Object { Write-Output "  $($_.Name) $($_.Id)" }
            Start-Sleep -Seconds 60
          }
          Write-Output "########## KEEP ALIVE END ##########"
