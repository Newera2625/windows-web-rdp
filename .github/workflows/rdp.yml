name: Windows Web RDP

on:
  workflow_dispatch:

jobs:
  myrtille-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Enable RDP & Create User
        shell: powershell
        run: |
          Write-Output "===== enable-rdp START ====="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "fAllowRemoteConnections" -Value 1 -Type DWord

          net user rdpuser "Newera@2625" /add
          net localgroup "Remote Desktop Users" rdpuser /add
          net localgroup "Administrators" rdpuser /add
          if ($LASTEXITCODE -ne 0) { throw "create user failed" }

          Write-Output "rdpuser created:"
          net user rdpuser
          Write-Output "===== enable-rdp END ====="

      - name: 2. Install IIS & Prerequisites
        shell: powershell
        run: |
          Write-Output "===== install-iis START ====="
          Get-WindowsFeature -Name NET-*, Web-* | Where-Object { $_.Name -notmatch "Ftp" } | Install-WindowsFeature -ErrorAction SilentlyContinue
          Set-Service -Name Spooler -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Spooler -ErrorAction SilentlyContinue
          Write-Output "===== install-iis END ====="

      - name: 3. Install Myrtille
        shell: powershell
        run: |
          Write-Output "===== install-myrtille START ====="
          $msi = "$env:TEMP\Myrtille.msi"
          $urls = @(
            "https://github.com/myrtille-rdp/myrtille/releases/download/v2.9.2/Myrtille_2.9.2_x86_x64_Setup.msi",
            "https://gh-proxy.org/https://github.com/myrtille-rdp/myrtille/releases/download/v2.9.2/Myrtille_2.9.2_x86_x64_Setup.msi"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 3; $i++) {
              Write-Output "try: $u (attempt $i)"
              curl.exe -L --retry 2 --retry-delay 5 -o $msi $u
              if ((Test-Path $msi) -and ((Get-Item $msi).Length -gt 1MB)) { $ok = $true; break }
              Start-Sleep -Seconds 5
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "myrtille download failed" }
          Write-Output "downloaded: $((Get-Item $msi).Length) bytes"
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          Write-Output "===== install-myrtille END ====="

      - name: 4. Start Cloudflare Tunnel & Show Info
        shell: powershell
        run: |
          Write-Output "===== tunnel START ====="
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          $workDir = (Get-Location).Path
          $outLog = "$workDir\cf-out.log"
          $errLog = "$workDir\cf-err.log"
          Start-Process -FilePath "$workDir\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:80 --no-autoupdate" -RedirectStandardOutput $outLog -RedirectStandardError $errLog -NoNewWindow
          $url = ""
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep -Seconds 5
            foreach ($lf in @($outLog, $errLog)) {
              if ((Test-Path $lf) -and ((Get-Item $lf).Length -gt 0)) {
                $logText = Get-Content $lf -Raw -ErrorAction SilentlyContinue
                if ($logText) {
                  $m = [regex]::Match($logText, 'https://[a-z0-9-]+\.trycloudflare\.com')
                  if ($m.Success) { $url = $m.Value; break }
                }
              }
            }
            if ($url) { break }
          }

          Write-Output ""
          Write-Output "======================================================"
          Write-Output "              WINDOWS WEB RDP READY"
          Write-Output "======================================================"
          Write-Output "  URL      : $url/Myrtille"
          Write-Output "  Username : rdpuser"
          Write-Output "  Password : Newera@2625"
          Write-Output "======================================================"
          Write-Output ""

          # ================= 诊断 =================
          Write-Output "===== RDP DIAG START ====="
          Write-Output "--- 3389 listening ---"
          netstat -ano | findstr "3389"
          Write-Output "--- 80 listening ---"
          netstat -ano | findstr ":80 "
          Write-Output "--- RDP reg keys ---"
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' | Select-Object UserAuthentication, SecurityLayer, fAllowRemoteConnections, PortNumber
          Write-Output "--- rdpuser ---"
          net user rdpuser
          Write-Output "--- Remote Desktop Users group ---"
          net localgroup "Remote Desktop Users"
          Write-Output "--- Myrtille dirs ---"
          Get-ChildItem "C:\Program Files\Myrtille" -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-ChildItem "C:\Program Files (x86)\Myrtille" -ErrorAction SilentlyContinue | Select-Object Name, Length
          Write-Output "--- Myrtille logs (last 50 lines) ---"
          $logFiles = @()
          $logFiles += Get-ChildItem "C:\Program Files\Myrtille" -Recurse -Include "*.log","*log*.txt" -ErrorAction SilentlyContinue
          $logFiles += Get-ChildItem "C:\Program Files (x86)\Myrtille" -Recurse -Include "*.log","*log*.txt" -ErrorAction SilentlyContinue
          $logFiles += Get-ChildItem "$env:ProgramData\Myrtille" -Recurse -Include "*.log" -ErrorAction SilentlyContinue
          if ($logFiles.Count -eq 0) {
            Write-Output "(no log files found)"
          } else {
            foreach ($lf in $logFiles) {
              Write-Output ">>> $($lf.FullName) <<<"
              Get-Content $lf.FullName -Tail 50 -ErrorAction SilentlyContinue
            }
          }
          Write-Output "--- IIS sites ---"
          Get-WebSite -ErrorAction SilentlyContinue | Select-Object Name, State, PhysicalPath, Bindings
          Write-Output "--- IIS app pools ---"
          Get-IISAppPool -ErrorAction SilentlyContinue | Select-Object Name, State, ProcessModel
          Write-Output "===== RDP DIAG END ====="

          # ================= 实时日志 + 保活 =================
          Write-Output "===== KEEP ALIVE START (5h, live log every 60s) ====="
          $loopDeadline = (Get-Date).AddHours(5)
          $tick = 0
          while ((Get-Date) -lt $loopDeadline) {
            $tick++
            Write-Output ""
            Write-Output "----- live tick #$tick  $(Get-Date -Format 'HH:mm:ss') -----"
            Write-Output "[3389]"
            (netstat -ano | findstr "3389") | ForEach-Object { Write-Output "  $_" }
            Write-Output "[80]"
            (netstat -ano | findstr ":80 ") | ForEach-Object { Write-Output "  $_" }
            Write-Output "[6080]"
            (netstat -ano | findstr "6080") | ForEach-Object { Write-Output "  $_" }

            $newLogs = @()
            $newLogs += Get-ChildItem "C:\Program Files\Myrtille" -Recurse -Include "*.log" -ErrorAction SilentlyContinue
            $newLogs += Get-ChildItem "C:\Program Files (x86)\Myrtille" -Recurse -Include "*.log" -ErrorAction SilentlyContinue
            $newLogs += Get-ChildItem "$env:ProgramData\Myrtille" -Recurse -Include "*.log" -ErrorAction SilentlyContinue
            if ($newLogs.Count -gt 0) {
              $latest = $newLogs | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              Write-Output "[myrtille log] $($latest.FullName) (mtime: $($latest.LastWriteTime))"
              Get-Content $latest.FullName -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "  $_" }
            } else {
              Write-Output "[myrtille log] (none found)"
            }

            if (Test-Path $errLog) {
              Write-Output "[cf-err tail]"
              Get-Content $errLog -Tail 5 -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "  $_" }
            }

            Start-Sleep -Seconds 60
          }
          Write-Output "===== KEEP ALIVE END ====="
